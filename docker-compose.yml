version: '3.8'

services:
    app:
        build: .
        container_name: gt_ai_gateway
        ports:
            - "8787:8787"
        environment:
            - NODE_ENV=production
            - PORT=8787
            - DB_PATH=/app/data/local.db
            # ROOT_TOKEN 必须改成自己生成的值（生成方式：openssl rand -hex 32）
            # 保留下面的示例值（或留空）时服务照常启动，但 root 权限失效、管理后台无法登录
            - ROOT_TOKEN=${ROOT_TOKEN:-your-root-token-here}
        volumes:
            - ./data:/app/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "node", "-e", "require('http').get('http://localhost:8787/welcome', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 5s
        networks:
            - ai_gateway_network

networks:
    ai_gateway_network:
        driver: bridge