name = "gt-ai-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-19"

# enhanced_error_serialization：让 name 与自定义属性穿过 fetch / 序列化边界。
# 上游超时与客户端断开以 TaggedError 作为 abort reason，workerd 默认（该 flag 关闭时）
# 会用 new Error 重建、只保留 message，导致 failed_code 丢失；开启后 name 与 failedCode 得以保留。
# 详见 src/util/abortTimeoutUtil.ts 的 isTaggedError 与 cloudflare/workerd#7035。
compatibility_flags = [ "nodejs_compat", "no_handle_cross_request_promise_resolution", "enhanced_error_serialization" ]


[vars]
# ROOT_TOKEN = "your-root-token-here"

# KV namespace for caching (optional). Uncomment and set id to enable.
# Override name via CLOUDFLARE_KV_NAME env var for auto-deploy.
# [[kv_namespaces]]
# binding = "CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# Object storage for request/response payloads (see objectStorageService).
# Required in worker mode; in node mode payloads persist to the storage_record
# table and this binding is unused. Create the bucket in the Cloudflare dashboard
# and set bucket_name to match.
[[r2_buckets]]
binding = "OBJECT_BUCKET"
bucket_name = "gt-ai-gateway-objects"

[[d1_databases]]
binding = "DB"
database_name = "gt_ai_gateway"
database_id = "replace-with-your-d1-database-id"

# [ai]
# binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "frontend/dist"
binding = "ASSETS"
